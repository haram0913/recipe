<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<title>영상 레시피</title>
<style>
  :root {
    --bg: #f7f2e9; --card: #fffdf8; --ink: #221c18; --sub: #7a6e64;
    --line: #e6dccd; --accent: #c2412b; --accent-soft: #f6e1d8; --ok: #3f7d4e;
    --soft: #ece6da; --accent-ink: #7c2414;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1714; --card: #26211d; --ink: #f1e9de; --sub: #a99d91;
      --line: #3a332d; --accent: #e0624a; --accent-soft: #4a2a22; --ok: #6fb380;
      --soft: #322c27; --accent-ink: #f3c3b6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  h1 { font-size: 20px; margin: 0 0 16px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 26px; margin: 14px 0 8px; letter-spacing: -0.03em; line-height: 1.25; }
  h3 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
  button, input, select { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 14px; min-height: 48px; cursor: pointer; white-space: nowrap;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--soft); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:active { background: var(--accent); opacity: .85; }
  button.primary:disabled { opacity: .55; cursor: wait; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input[type=text], input[type=url], input[type=password], select {
    width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--card);
    border-radius: 10px; padding: 10px 14px; min-height: 52px; font-size: 17px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
  .hint { font-size: 14px; color: var(--sub); margin: 6px 0 0; }
  label.check { display: flex; gap: 10px; align-items: center; min-height: 48px; margin: 8px 0 0; font-size: 15px; }
  label.check input { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }

  /* 첫 화면 */
  #home { max-width: 600px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  #form .row { flex-direction: column; align-items: stretch; }
  #form button { min-height: 52px; }
  details.settings { margin-top: 10px; font-size: 15px; }
  details.settings summary { cursor: pointer; color: var(--sub); padding: 12px 0; }
  details.settings label:not(.check) { display: block; margin: 10px 0 4px; color: var(--sub); }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 15px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--accent-soft); color: var(--accent-ink); }
  .msg.info { background: var(--soft); }
  #histCard { margin-top: 20px; }
  .history { list-style: none; margin: 8px 0 0; padding: 0; }
  .history li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .history li:first-child { border-top: 0; }
  .history a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
  .history img { width: 88px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex: none; background: var(--soft); }
  .history .ht { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; font-weight: 600; }
  .history button { font-size: 14px; color: var(--sub); flex: none; }

  /* 레시피 화면: 옆으로 넘기는 카드 */
  #recipe { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .top { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .top .rt { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .count { color: var(--sub); font-variant-numeric: tabular-nums; font-size: 15px; padding-right: 4px; }
  .deck {
    flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .deck::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; min-width: 0; display: flex; padding: 2px 12px 8px; scroll-snap-align: start; scroll-snap-stop: always; }
  .slide > .card { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior-y: contain; display: flex; flex-direction: column; }
  .bottom { display: flex; align-items: center; gap: 12px; padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bottom button { min-width: 80px; min-height: 52px; }
  .bottom .mid { flex: 1; min-width: 0; text-align: center; font-size: 14px; color: var(--sub); }
  .bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }

  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; display: block; background: var(--soft); flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
  .chip { font-size: 14px; padding: 5px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); }
  .chip.tag { background: var(--soft); color: var(--sub); }
  .src { display: inline-block; font-size: 15px; color: var(--accent); padding: 10px 0; }
  .spacer { flex: 1; }
  .swipe { text-align: center; color: var(--sub); font-size: 15px; margin: 12px 0 0; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stepper button { border: 0; border-radius: 0; width: 52px; min-height: 48px; padding: 0; font-size: 22px; line-height: 1; }
  .stepper output { padding: 0 8px; min-width: 64px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 8px; margin: 12px 0 4px; }
  .tools button { font-size: 15px; flex: 1; }
  ul.list { list-style: none; margin: 4px 0 0; padding: 0; }
  .list li { border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list label { display: flex; gap: 14px; padding: 14px 0; min-height: 52px; cursor: pointer; align-items: flex-start; -webkit-tap-highlight-color: transparent; }
  .list input[type=checkbox] { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--ok); flex: none; }
  .list .done { color: var(--sub); text-decoration: line-through; }
  .qty { font-weight: 700; font-variant-numeric: tabular-nums; }
  .note { display: block; font-size: 14px; color: var(--sub); }
  .est { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--sub); margin-left: 6px; vertical-align: 1px; }

  .stepnum { color: var(--accent); font-weight: 700; font-size: 15px; }
  .stepnum b { font-size: 44px; line-height: 1; letter-spacing: -0.03em; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .steptext { font-size: 24px; line-height: 1.5; letter-spacing: -0.02em; margin: 16px 0; word-break: keep-all; overflow-wrap: anywhere; }
  .steptext.done { color: var(--sub); }
  .donebtn { width: 100%; min-height: 56px; font-weight: 600; flex: none; }
  .donebtn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<main id="home">
  <h1>영상 <span>레시피</span></h1>
  <form id="form">
    <div class="row">
      <input id="url" type="url" placeholder="유튜브 영상 링크 붙여넣기" aria-label="유튜브 영상 링크" required>
      <button class="primary" id="go" type="submit">레시피 만들기</button>
    </div>
  </form>

  <details class="settings" id="settings">
    <summary>설정 (API 키 · 모델)</summary>
    <label for="key">Gemini API 키</label>
    <div class="row">
      <input id="key" type="password" autocomplete="off" placeholder="AI Studio에서 발급한 키">
      <button type="button" id="saveKey">저장</button>
    </div>
    <p class="hint">키는 이 브라우저에만 저장되고, 구글 Gemini API로만 전송됩니다.</p>
    <label for="model">모델</label>
    <select id="model"></select>
    <input id="modelManual" type="text" placeholder="모델 ID 직접 입력" hidden>
    <label for="think">추론 수준</label>
    <select id="think">
      <option value="">모델 기본값</option>
      <option value="low">낮음</option>
      <option value="medium">중간</option>
      <option value="high">높음</option>
    </select>
    <label class="check"><input type="checkbox" id="lowRes" checked> 저해상도로 분석 (토큰 절약)</label>
  </details>

  <div class="msg" id="msg" role="status"></div>

  <section class="card" id="histCard" hidden>
    <h3>저장된 레시피</h3>
    <ul class="history" id="hist"></ul>
  </section>
</main>

<div id="recipe" hidden>
  <div class="top">
    <button type="button" id="back" aria-label="목록으로 돌아가기">← 목록</button>
    <div class="rt" id="rtitle"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="deck" id="deck"></div>
  <div class="bottom">
    <button type="button" id="prev">이전</button>
    <div class="mid"><div class="bar"><i id="barFill"></i></div><span id="progText"></span></div>
    <button type="button" id="next">다음</button>
  </div>
</div>

<script>
const API = 'https://generativelanguage.googleapis.com/v1beta';
const $ = id => document.getElementById(id);
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}
function msg(text, kind = 'info') {
  const m = $('msg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? ' show ' + kind : '');
}

/* ---------- 설정 ---------- */
let apiKey = store.get('rc_key', '');
$('key').value = apiKey;
$('lowRes').checked = store.get('rc_lowres', true);
$('lowRes').onchange = () => store.set('rc_lowres', $('lowRes').checked);
$('think').value = store.get('rc_think', 'medium');
$('think').onchange = () => store.set('rc_think', $('think').value);
if (!apiKey) $('settings').open = true;

async function loadModels() {
  const sel = $('model');
  sel.replaceChildren();
  if (!apiKey) return;
  try {
    const r = await fetch(`${API}/models?pageSize=200`, { headers: { 'x-goog-api-key': apiKey } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || r.status);
    const skip = /image|tts|embedding|live|audio|robotics|computer|aqa|gemma|learnlm/i;
    const names = ((await r.json()).models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace('models/', ''))
      .filter(n => n.startsWith('gemini') && !skip.test(n))
      .sort().reverse();
    if (!names.length) throw new Error('사용 가능한 모델이 없습니다');
    for (const n of names) sel.append(el('option', { value: n, textContent: n }));
    const saved = store.get('rc_model', '');
    sel.value = names.includes(saved) ? saved
      : (names.find(n => /hydrogen/.test(n)) || names.find(n => /flash/.test(n) && !/lite|preview|exp/.test(n)) || names.find(n => /flash/.test(n)) || names[0]);
    sel.hidden = false; $('modelManual').hidden = true;
  } catch (e) {
    sel.hidden = true; $('modelManual').hidden = false;
    $('modelManual').value = store.get('rc_model', '');
    msg('모델 목록을 불러오지 못했습니다: ' + e.message + ' — 키를 확인하거나 모델 ID를 직접 입력하세요.', 'err');
  }
}
$('model').onchange = () => store.set('rc_model', $('model').value);
$('modelManual').onchange = () => store.set('rc_model', $('modelManual').value.trim());
$('saveKey').onclick = async () => {
  apiKey = $('key').value.trim();
  store.set('rc_key', apiKey);
  msg('');
  await loadModels();
  if (apiKey && !$('model').hidden) msg('키를 저장했습니다.');
};
const currentModel = () => ($('model').hidden ? $('modelManual').value.trim() : $('model').value);

/* ---------- Gemini 호출 ---------- */
const SCHEMA = {
  type: 'OBJECT',
  properties: {
    title: { type: 'STRING' },
    servings: { type: 'INTEGER' },
    prepMinutes: { type: 'INTEGER', nullable: true },
    cookMinutes: { type: 'INTEGER', nullable: true },
    tags: { type: 'ARRAY', items: { type: 'STRING' } },
    ingredients: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          name: { type: 'STRING' },
          amount: { type: 'NUMBER', nullable: true },
          unit: { type: 'STRING', nullable: true },
          note: { type: 'STRING', nullable: true },
          estimated: { type: 'BOOLEAN' },
        },
        required: ['name', 'estimated'],
      },
    },
    steps: { type: 'ARRAY', items: { type: 'STRING' } },
  },
  required: ['title', 'servings', 'ingredients', 'steps'],
};
const PROMPT = `이 요리 영상을 보고 레시피를 한국어로 정리해 주세요.
- title: 요리 이름만 간단히.
- servings: 영상의 분량이 몇 인분인지. 언급이 없으면 재료 양으로 판단.
- prepMinutes, cookMinutes: 준비 시간과 조리 시간(분). 알 수 없으면 null.
- tags: 요리 종류나 특징 태그 2~4개 ("#" 없이).
- ingredients: 영상에 등장한 순서대로 모든 재료.
  amount는 반드시 숫자(반 개는 0.5), unit은 "모", "큰술", "작은술", "g", "ml", "개", "줌", "꼬집" 같은 단위.
  "약간", "적당량"처럼 수량이 없는 재료는 amount와 unit을 null로.
  note에는 손질 방법, 대체 재료, 그램 환산 등 보충 설명을 짧게. 없으면 null.
  영상에서 분량을 직접 말하거나 자막으로 보여주지 않아 어림한 값이면 estimated를 true로.
- steps: 조리 순서. 한 단계에 한 동작씩, 불 세기와 시간 포함. 번호는 붙이지 말 것.
  한 단계는 휴대폰 화면 한 장에 크게 보이도록 두세 문장 이내로.
영상이 요리 영상이 아니면 title을 "레시피 없음"으로 하고 나머지는 비워 주세요.`;

async function callGemini(videoUrl, lowRes, think, attempt = 0) {
  const body = {
    contents: [{ parts: [{ file_data: { file_uri: videoUrl } }, { text: PROMPT }] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: SCHEMA },
  };
  if (lowRes) body.generationConfig.mediaResolution = 'MEDIA_RESOLUTION_LOW';
  if (think) body.generationConfig.thinkingConfig = { thinkingLevel: think };
  const r = await fetch(`${API}/models/${encodeURIComponent(currentModel())}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const detail = data.error?.message || '';
    if (r.status === 400 && lowRes && /resolution/i.test(detail)) return callGemini(videoUrl, false, think);
    if (r.status === 400 && think && /thinking/i.test(detail)) return callGemini(videoUrl, lowRes, '');
    if ((r.status === 503 || r.status === 500) && attempt < 3) {
      const wait = [5, 12, 25][attempt];
      msg(`모델에 요청이 몰려 있습니다. ${wait}초 뒤 자동으로 다시 시도합니다 (${attempt + 1}/3)`);
      await new Promise(res => setTimeout(res, wait * 1000));
      msg('영상을 다시 분석하고 있습니다.');
      return callGemini(videoUrl, lowRes, think, attempt + 1);
    }
    const e = new Error(detail || 'HTTP ' + r.status);
    e.status = r.status;
    throw e;
  }
  const text = (data.candidates?.[0]?.content?.parts || [])
    .filter(p => p.text && !p.thought).map(p => p.text).join('');
  if (!text) throw new Error('응답이 비어 있습니다' + (data.promptFeedback?.blockReason ? ' (' + data.promptFeedback.blockReason + ')' : ''));
  return JSON.parse(text);
}

function videoId(url) {
  const m = url.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}

$('form').onsubmit = async ev => {
  ev.preventDefault();
  const id = videoId($('url').value.trim());
  if (!id) return msg('유튜브 영상 링크가 아닙니다.', 'err');
  if (!apiKey) { $('settings').open = true; return msg('먼저 설정에서 Gemini API 키를 저장하세요.', 'err'); }
  if (!currentModel()) return msg('모델을 선택하세요.', 'err');
  const go = $('go');
  go.disabled = true; go.textContent = '분석 중…';
  msg('영상을 분석하고 있습니다. 영상 길이에 따라 수십 초가 걸릴 수 있습니다.');
  try {
    const data = await callGemini('https://www.youtube.com/watch?v=' + id, $('lowRes').checked, $('think').value);
    if (!data.ingredients?.length || !data.steps?.length) throw new Error('이 영상에서 레시피를 찾지 못했습니다.');
    const rec = { id, data, serv: data.servings || 1, ing: [], step: [], pos: 0, at: Date.now() };
    saveRecipe(rec);
    msg('');
    $('url').value = '';
    show(rec);
  } catch (e) {
    const hint = e.status === 503 || e.status === 500 ? '모델에 요청이 몰려 세 번 다시 시도했지만 응답이 없습니다. 잠시 뒤 다시 누르거나 설정에서 다른 모델을 고르세요. '
      : e.status === 429 ? '사용 한도를 넘었습니다. 잠시 뒤 다시 시도하거나 설정에서 다른 모델을 고르세요. '
      : e.status === 403 || e.status === 401 ? 'API 키가 올바르지 않거나 권한이 없습니다. '
      : e.status === 402 ? '선불 잔액이 없습니다. ' : '';
    msg(hint + (e.message || '알 수 없는 오류'), 'err');
  } finally {
    go.disabled = false; go.textContent = '레시피 만들기';
  }
};

/* ---------- 저장 ---------- */
let recipes = store.get('rc_recipes', []);
let cur = null;
const thumbUrl = id => 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
function saveRecipe(rec) {
  recipes = [rec, ...recipes.filter(r => r.id !== rec.id)].slice(0, 200);
  store.set('rc_recipes', recipes);
  renderHistory();
}
const persist = () => store.set('rc_recipes', recipes);
function renderHistory() {
  $('histCard').hidden = !recipes.length;
  $('hist').replaceChildren(...recipes.map(r => {
    const a = el('a', { href: '#' },
      el('img', { src: thumbUrl(r.id), alt: '', loading: 'lazy' }),
      el('span', { className: 'ht', textContent: r.data.title }));
    a.onclick = e => { e.preventDefault(); show(r); };
    const del = el('button', { type: 'button', textContent: '삭제' });
    del.setAttribute('aria-label', r.data.title + ' 삭제');
    del.onclick = () => {
      if (!confirm('"' + r.data.title + '" 레시피를 삭제할까요?')) return;
      recipes = recipes.filter(x => x !== r); persist(); renderHistory();
    };
    return el('li', {}, a, del);
  }));
}

/* ---------- 수량 표시 ---------- */
const FRACS = [[0.25, '¼'], [1 / 3, '⅓'], [0.5, '½'], [2 / 3, '⅔'], [0.75, '¾']];
function fmt(n) {
  if (n >= 20) return String(Math.round(n));
  const whole = Math.floor(n + 1e-9), rest = n - whole;
  if (rest < 0.04) return String(whole);
  if (rest > 0.96) return String(whole + 1);
  const f = FRACS.find(([v]) => Math.abs(rest - v) < 0.04);
  if (f) return (whole ? whole + ' ' : '') + f[1];
  return String(Math.round(n * 10) / 10);
}
const qtyText = (i, ratio) => i.amount == null ? (i.unit || '적당량') : fmt(i.amount * ratio) + (i.unit ? ' ' + i.unit : '');

/* ---------- 화면 켜짐 유지 ---------- */
let wakeLock = null, wakeOn = false;
async function setWake(on) {
  wakeOn = on;
  try {
    if (on) wakeLock = await navigator.wakeLock.request('screen');
    else { await wakeLock?.release(); wakeLock = null; }
  } catch { wakeOn = false; }
  return wakeOn;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeOn && cur) setWake(true);
});

/* ---------- 레시피 화면 ---------- */
const deck = $('deck');
const slide = (cls, ...kids) => el('section', { className: 'slide' }, el('div', { className: 'card ' + cls }, ...kids));
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
const goTo = i => deck.scrollTo({ left: i * deck.clientWidth, behavior: smooth() });
const slideCount = () => cur.data.steps.length + 2;

function show(rec, push = true) {
  cur = rec;
  const d = rec.data;
  $('home').hidden = true; $('recipe').hidden = false;
  $('rtitle').textContent = d.title;
  document.title = d.title + ' · 영상 레시피';
  deck.replaceChildren(overviewSlide(), ingSlide(), ...d.steps.map(stepSlide));
  renderIngs(); progress();
  const start = Math.min(rec.pos || 0, slideCount() - 1);
  requestAnimationFrame(() => { deck.scrollLeft = start * deck.clientWidth; updatePos(); });
  if (push) history.pushState({ recipe: true }, '');
}
function closeRecipe() {
  cur = null; setWake(false);
  $('recipe').hidden = true; $('home').hidden = false;
  document.title = '영상 레시피';
  renderHistory();
}
$('back').onclick = () => history.state?.recipe ? history.back() : closeRecipe();
addEventListener('popstate', () => { if (cur) closeRecipe(); });

function overviewSlide() {
  const d = cur.data, meta = [];
  if (d.prepMinutes) meta.push('준비 ' + d.prepMinutes + '분');
  if (d.cookMinutes) meta.push('조리 ' + d.cookMinutes + '분');
  meta.push('기준 ' + d.servings + '인분');
  meta.push('재료 ' + d.ingredients.length + '가지');
  let wake = null;
  if ('wakeLock' in navigator) {
    const cb = el('input', { type: 'checkbox', checked: wakeOn });
    cb.onchange = async () => { cb.checked = await setWake(cb.checked); };
    wake = el('label', { className: 'check' }, cb, ' 요리하는 동안 화면 켜 두기');
  }
  const reset = el('button', { type: 'button', textContent: '체크 전부 지우기' });
  reset.onclick = () => { cur.ing = []; cur.step = []; persist(); const r = cur; show(r, false); };
  return slide('',
    el('img', { className: 'thumb', src: thumbUrl(cur.id), alt: d.title + ' 영상 썸네일' }),
    el('h2', { textContent: d.title }),
    el('div', { className: 'chips' }, meta.map(t => el('span', { className: 'chip', textContent: t }))),
    el('div', { className: 'chips' }, (d.tags || []).map(t => el('span', { className: 'chip tag', textContent: '#' + t.replace(/^#/, '') }))),
    el('div', {}, el('a', { className: 'src', href: 'https://www.youtube.com/watch?v=' + cur.id, target: '_blank', rel: 'noopener', textContent: '원본 영상 보기' })),
    wake,
    el('div', { className: 'spacer' }),
    reset,
    el('p', { className: 'swipe', textContent: '옆으로 밀면 재료와 조리 단계가 한 장씩 나옵니다' }));
}

function ingSlide() {
  const minus = el('button', { type: 'button', textContent: '−' }); minus.setAttribute('aria-label', '인분 줄이기');
  const plus = el('button', { type: 'button', textContent: '+' }); plus.setAttribute('aria-label', '인분 늘리기');
  minus.onclick = () => setServ(cur.serv - 1);
  plus.onclick = () => setServ(cur.serv + 1);
  const copy = el('button', { type: 'button', textContent: '전체 복사' });
  copy.onclick = async () => {
    const d = cur.data, ratio = cur.serv / (d.servings || 1);
    const text = `${d.title} 재료 (${cur.serv}인분)\n` +
      d.ingredients.map(i => `- ${i.name} ${qtyText(i, ratio)}${i.note ? ' (' + i.note + ')' : ''}`).join('\n');
    try { await navigator.clipboard.writeText(text); copy.textContent = '복사됨'; }
    catch { copy.textContent = '복사 실패'; }
    setTimeout(() => copy.textContent = '전체 복사', 1500);
  };
  const reset = el('button', { type: 'button', textContent: '원래 분량으로' });
  reset.onclick = () => setServ(cur.data.servings || 1);
  return slide('',
    el('div', { className: 'head' }, el('h3', { textContent: '재료' }),
      el('div', { className: 'stepper' }, minus, el('output', { id: 'serv' }), plus)),
    el('div', { className: 'tools' }, copy, reset),
    el('ul', { className: 'list', id: 'ings' }),
    el('p', { className: 'hint', textContent: '"추정"은 영상에서 정확한 분량을 말하지 않아 AI가 어림한 값입니다.' }));
}
function renderIngs() {
  const d = cur.data, ratio = cur.serv / (d.servings || 1);
  $('serv').textContent = cur.serv + '인분';
  $('ings').replaceChildren(...d.ingredients.map((i, n) => {
    const cb = el('input', { type: 'checkbox', checked: !!cur.ing[n] });
    const text = el('span', { className: cur.ing[n] ? 'done' : '' },
      el('span', { className: 'qty', textContent: qtyText(i, ratio) }), ' ' + i.name,
      i.estimated && i.amount != null ? el('span', { className: 'est', textContent: '추정' }) : null,
      i.note ? el('span', { className: 'note', textContent: i.note }) : null);
    cb.onchange = () => { cur.ing[n] = cb.checked; text.className = cb.checked ? 'done' : ''; persist(); };
    return el('li', {}, el('label', {}, cb, text));
  }));
}
function setServ(n) { cur.serv = Math.min(50, Math.max(1, n)); persist(); renderIngs(); }

function stepSlide(s, n) {
  const total = cur.data.steps.length;
  const text = el('p', { className: 'steptext', textContent: s });
  const btn = el('button', { type: 'button', className: 'donebtn' });
  const paint = () => {
    const on = !!cur.step[n];
    btn.textContent = on ? '완료함 · 누르면 취소' : (n < total - 1 ? '완료하고 다음 단계로' : '완료');
    btn.classList.toggle('on', on);
    text.classList.toggle('done', on);
  };
  btn.onclick = () => {
    cur.step[n] = !cur.step[n]; persist(); paint(); progress();
    if (cur.step[n] && n < total - 1) goTo(n + 3);
  };
  paint();
  return slide('',
    el('div', { className: 'stepnum' }, el('b', { textContent: n + 1 }), `/ ${total}단계`),
    text, el('div', { className: 'spacer' }), btn);
}
function progress() {
  const total = cur.data.steps.length, done = cur.data.steps.filter((_, n) => cur.step[n]).length;
  $('barFill').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  $('progText').textContent = `${total}단계 중 ${done}단계 완료`;
}

function updatePos() {
  if (!cur || !deck.clientWidth) return;
  const n = slideCount(), i = Math.max(0, Math.min(n - 1, Math.round(deck.scrollLeft / deck.clientWidth)));
  $('count').textContent = `${i + 1} / ${n}`;
  $('prev').disabled = i === 0;
  $('next').disabled = i === n - 1;
  if (cur.pos !== i) { cur.pos = i; persist(); }
  return i;
}
let ticking = false;
deck.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; updatePos(); });
}, { passive: true });
$('prev').onclick = () => goTo(updatePos() - 1);
$('next').onclick = () => goTo(updatePos() + 1);
addEventListener('resize', () => { if (cur) deck.scrollLeft = (cur.pos || 0) * deck.clientWidth; });

renderHistory();
loadModels();
</script>
</body>
</html>
